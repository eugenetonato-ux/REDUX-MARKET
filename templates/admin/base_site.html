{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | REDUX Administration{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
  :root {
    --primary: #0071e3;
    --primary-hover: #0077ed;
    --secondary: #1d1d1f;
    --header-bg: #1d1d1f;
    --header-color: #FFFFFF;
    --breadcrumbs-bg: #f5f5f7;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif !important;
    background-color: #f5f5f7 !important;
    color: #1d1d1f !important;
  }
  #header {
    background: #1d1d1f !important;
    color: #FFFFFF !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
    padding: 12px 24px !important;
  }
  #branding h1 {
    font-size: 1.25rem !important;
    font-weight: 700 !important;
    letter-spacing: -0.02em !important;
  }
  #branding h1 a:link, #branding h1 a:visited {
    color: #FFFFFF !important;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .module h2, .module caption, .inline-group h2 {
    background: #f5f5f7 !important;
    color: #1d1d1f !important;
    font-weight: 700 !important;
    border-radius: 8px 8px 0 0 !important;
  }
  .button, input[type=submit], input[type=button], .submit-row input, a.button {
    background: #0071e3 !important;
    border-radius: 9999px !important;
    font-weight: 600 !important;
    padding: 8px 18px !important;
    font-size: 12px !important;
    border: none !important;
    transition: all 0.2s ease !important;
  }
  .button:hover, input[type=submit]:hover {
    background: #0077ed !important;
  }
  .admin-return-link {
    color: #a1a1a6 !important;
    font-size: 12px !important;
    text-decoration: none !important;
    padding: 5px 12px !important;
    background: rgba(255, 255, 255, 0.1) !important;
    border-radius: 9999px !important;
    font-weight: 500 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    transition: all 0.2s ease !important;
  }
  .admin-return-link:hover {
    background: rgba(255, 255, 255, 0.2) !important;
    color: #FFFFFF !important;
  }
</style>
{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}">
    <strong>REDUX</strong>
    <span style="font-size: 0.7rem; background: rgba(255, 255, 255, 0.15); color: #fff; padding: 2px 8px; border-radius: 9999px; font-weight: 600; letter-spacing: 0.05em;">ADMINISTRATION</span>
  </a>
</div>
{% endblock %}

{% block nav-global %}
<div style="float: right; margin-right: 1.5rem; display: flex; align-items: center;">
  <a href="/" class="admin-return-link">
    &larr; Retour au site public
  </a>
</div>
{% endblock %}
